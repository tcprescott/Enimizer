name: CI

on:
  push:
    branches: [2MBRom]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish linux-x64
        run: tools/publish.sh linux-x64
      - name: Smoke test
        run: dist/linux-x64/EnemizerCLI.Core --help
      - uses: actions/upload-artifact@v4
        with:
          name: enemizer-linux-x64
          path: dist/linux-x64.tar.gz
