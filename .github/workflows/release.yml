name: Release

# Push a tag (e.g. v6.2.0) to build every runtime and attach the tarballs to a
# GitHub release. alttpr's composer.json points at these release assets.
# CI's manual run calls this with a tag name instead, for when a tag can't be
# pushed from where you are; the release then creates the tag on that commit.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish all runtimes
        run: tools/publish.sh linux-x64 linux-arm64 osx-x64 osx-arm64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes \
            dist/linux-x64.tar.gz dist/linux-arm64.tar.gz dist/osx-x64.tar.gz dist/osx-arm64.tar.gz
