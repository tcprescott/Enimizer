name: Release

# Push a tag (e.g. v6.2.0) to build every runtime and attach the tarballs to a
# GitHub release. alttpr's composer.json points at these release assets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish all runtimes
        run: tools/publish.sh linux-x64 linux-arm64 osx-x64 osx-arm64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/linux-x64.tar.gz dist/linux-arm64.tar.gz dist/osx-x64.tar.gz dist/osx-arm64.tar.gz
